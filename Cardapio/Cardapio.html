<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasserie Victoria</title>
    <style>
         html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        /* Container que exibe o PDF */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Botão reserva caso o celular bloqueie a abertura direta */
        .fallback-btn {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
    </style>
</head>
<body>
    <iframe src="Menu Balcão BV 2026.PDF" frameborder="0"></iframe>
</body>
</html>
